<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="בן אלקיים – PMO ומנהל פרויקטים טכנולוגיים, Priority ERP, Power BI ומערכות AI">
  <title>בן אלקיים | PMO · מנהל פרויקטים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- defer: הסקריפטים רצים אחרי שה-HTML נטען, לפי הסדר -->
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- פס התקדמות גלילה -->
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <!-- רקע דקורטיבי -->
  <div class="bg-art" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="grid-floor"></span>
    <span class="stars"></span>
  </div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="nav">
      <a href="#top" class="logo">B<span>.</span>E</a>
      <button class="menu-toggle" id="menuToggle" aria-label="פתיחת תפריט" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="#about">עליי</a></li>
        <li><a href="#experience">ניסיון</a></li>
        <li><a href="#skills">כישורים</a></li>
        <li><a href="#education">השכלה</a></li>
        <li><a href="#contact">צור קשר</a></li>
        <li><a id="navLinkedin" target="_blank" rel="noopener" class="nav-in">in</a></li>
        <li><button class="theme-toggle" id="themeToggle" aria-label="החלפת ערכת צבעים">🌙</button></li>
      </ul>
    </nav>
  </header>

  <main id="top">

    <!-- Hero: התוכן מוזרק מ-app.js -->
    <section class="hero" id="hero"></section>

    <section class="stats" id="stats" aria-label="נתונים מרכזיים"></section>

    <section id="about" class="section reveal">
      <h2 class="section-title">עליי</h2>
      <p class="about-text" id="aboutText"></p>
      <div class="cards" id="aboutCards"></div>
    </section>

    <section id="experience" class="section reveal">
      <h2 class="section-title">ניסיון תעסוקתי</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="skills" class="section reveal">
      <h2 class="section-title">כישורים וכלים</h2>
      <div class="filters" id="skillFilters" role="group" aria-label="סינון כישורים"></div>
      <div class="table-wrap">
        <table>
          <caption id="skillsCaption"></caption>
          <thead>
            <tr>
              <th scope="col">תחום</th>
              <th scope="col">כלים ומיומנויות</th>
              <th scope="col"><button class="sort-btn" id="sortLevel">רמה ⇅</button></th>
            </tr>
          </thead>
          <tbody id="skillsBody"></tbody>
        </table>
      </div>
    </section>

    <section id="education" class="section reveal">
      <h2 class="section-title">השכלה והתפתחות</h2>
      <div class="cards" id="educationCards"></div>
    </section>

    <section id="contact" class="section reveal">
      <h2 class="section-title">צור קשר</h2>
      <div class="contact-grid">
        <ul class="contact-info" id="contactInfo"></ul>

        <form class="contact-form" id="contactForm" name="contact" method="post" data-netlify="true" novalidate>
          <input type="hidden" name="form-name" value="contact">
          <div class="form-row">
            <label for="name">שם מלא</label>
            <input type="text" id="name" name="name" placeholder="ישראל ישראלי">
            <small class="error" data-for="name"></small>
          </div>
          <div class="form-row">
            <label for="email">אימייל</label>
            <input type="email" id="email" name="email" placeholder="you@company.com" dir="ltr">
            <small class="error" data-for="email"></small>
          </div>
          <div class="form-row full">
            <label for="topic">נושא הפנייה</label>
            <select id="topic" name="topic">
              <option value="job">הצעת עבודה</option>
              <option value="project">פרויקט / ייעוץ</option>
              <option value="ai">הטמעת AI</option>
              <option value="other">אחר</option>
            </select>
          </div>
          <div class="form-row full">
            <label for="message">הודעה <span class="counter" id="msgCounter">0/500</span></label>
            <textarea id="message" name="message" rows="5" maxlength="500" placeholder="ספרו לי במה אוכל לעזור..."></textarea>
            <small class="error" data-for="message"></small>
          </div>
          <button type="submit" class="btn btn-primary full" id="submitBtn">שליחה</button>
        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> בן אלקיים · HTML, CSS ו-Vanilla JavaScript · Netlify</p>
  </footer>

  <button class="to-top" id="toTop" aria-label="חזרה לראש הדף">↑</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">כדי לראות את התוכן המלא יש להפעיל JavaScript בדפדפן.</p>
  </noscript>
</body>
</html>
